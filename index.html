<!DOCTYPE html>
<html lang="en">
    <head>
        <title>
            Dino trading simulation
        </title>
        <meta charset="UTF-8">
        <link rel="stylesheet" type="text/css" href="styles.css">
    </head>
    <body class="bg-start">
        <h1>Trading simulation</h1>
        <button type="button" id="start">Press Here to Start</button><button type="button" id="lesson">Click here to have a lesson first</button>

        <div id="learn" hidden>
            <button type="button" id="learnbtn">Click to see the dinos</button>
        </div>

        <div id="intro" hidden>
            <h2>Meet the dinos</h2>
            <div class="box1">Bank: <span id="bankTotal"></span> Rocks</div>
            <div class="grid">
                <div class="box" onclick="openPopup('Lewis The Lazy Dinosaur')">
                    <img src="/imgs/Lewis.jpg" alt="Lewis">
                </div>
                <div class="box" onclick="openPopup('Clara The Cowgirl Dinosaur')">
                    <img src="/imgs/Clara.jpg" alt="Clara">
                </div>
                <div class="box" onclick="openPopup('Durhack Dino')">
                    <img src="/imgs/DurhackDino.jpg" alt="Durhack Dino">
                </div>

                <div class="box controls"></div>
                <div class="box controls"></div>
                <div class="box controls"></div>

                <div class="box" onclick="openPopup('Imogen the Influencer Dino')">
                    <img src="/imgs/Imogen.jpg" alt="Imogen">
                </div>
                <div class="box" onclick="openPopup('Steve the Sports Dinosaur')">
                    <img src="/imgs/Steve.jpg" alt="Steve">
                </div>
                <div class="box" onclick="openPopup('Mia the Musical Dinosaur')">
                    <img src="/imgs/Mia.jpg" alt="Mia">
                </div>

                <div class="box controls"></div>
                <div class="box controls"></div>
                <div class="box controls"></div>
            </div>

            <div class="popup" id="popup">
                <div class="popup-content">
                    <p id="popup-text"></p>
                    <button class="close-btn" onclick="closePopup()">X Close</button>
                </div>
            </div>
            <br>
            <button type="button" id="to_trading">Are You Ready To Start Trading?</button>

        </div>
        <div id="simulation" hidden>
            <div id="alert" role="alert" aria-live="assertive">
                <strong id="aTitle"></strong>
                <p id="aBody"></p>
                <div id="aBar"><i id="aFill"></i></div>
                <button id="aPause" type="button"></button>
                </div>
                <div class="wrap">
                    <h1>Stock game</h1>
                    <p class="sub">Five minutes live that stand in for two months (one simulated day every 5 seconds). Price axis is logarithmic, from 1 to 2500.</p>

                    <div class="panel"><canvas id="chart"></canvas></div>
                     <div class="stats">
                        <div class="stat"><span>Bank</span><b id="bank"></b></div>
                        <div class="stat"><span>Portfolio value</span><b id="portfolio"></b></div>
                    </div>
                    <div class="bar">
                        <button id="go">Start</button>
                        <label>Speed <select id="speed"><option value="1">1x</option><option value="5">5x</option><option value="20">20x</option></select></label>
                        <span id="clock"></span>
                    </div>
                    <div class="legend" id="legend"></div>
                    
                </div>
                <button type="button" id="finalscreen">Final Score!</button>
        </div>
        <div id="finished" hidden>
            <div id="finalbox">
            </div>
        </div>
        <script src="scripts.js"></script> 
    </body>
</html>
