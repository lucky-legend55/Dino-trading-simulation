<!DOCTYPE html>
<html lang="en">
    <head>
        <title>
            Dino trading simulation
        </title>
        <meta charset="UTF-8">
        <link rel="stylesheet" type="text/css" href="styles.css">
    </head>
    <body>
        <h1>Trading simulation</h1>
        <button type="button" id="start">Press Here to Start</button>

        <div id="intro" hidden>
            <h2>Meet the dinos</h2>
            <p id="screen2bank"></p>
            <div class="grid">
                <div class="box" onclick="openPopup('Lewis The Lazy Dinosaur')">
                    <img src="/imgs/Lewis.jpg" alt="Lewis">
                </div>
                <div class="box" onclick="openPopup('Clara The Cowgirl Dinosaur')">
                    <img src="https://via.placeholder.com/100" alt="Clara">
                </div>
                <div class="box" onclick="openPopup('Durhack Dino')">
                    <img src="https://via.placeholder.com/100" alt="Durhack Dino">
                </div>

                <div class="box">Lewis</div>
                <div class="box">Clara</div>
                <div class="box">Durhack Dino</div>

                <div class="box" onclick="openPopup('Imogen the Influencer Dino')">
                    <img src="https://via.placeholder.com/100" alt="Imogen">
                </div>
                <div class="box" onclick="openPopup('Steve the Sports Dinosaur')">
                    <img src="https://via.placeholder.com/100" alt="Steve">
                </div>
                <div class="box" onclick="openPopup('Mia the Musical Dinosaur')">
                    <img src="https://via.placeholder.com/100" alt="Mia">
                </div>

                <div class="box">Imogen</div>
                <div class="box">Steve</div>
                <div class="box">Mia</div>
            </div>

            <div class="popup" id="popup">
                <div class="popup-content">
                    <p id="popup-text"></p>
                    <button class="close-btn" onclick="closePopup()">X Close</button>
                </div>
            </div>
            <br>
            <button type="button" id="to_trading">Are You Ready To Start Trading?</button>

        </div>
        <div id="simulation" hidden>
            <div id="bankscreen">
                <div id="main">
                    <div class="box1">Bank</div>
                    <div class="box1">Stocks</div>
                </div>
                <div id="sidebar">
                    <div class="box1">Lewis</div>
                    <div class="box1">Clara</div>
                    <div class="box1">Durhack Dino</div>
                    <div class="box1">Imogen</div>
                    <div class="box1">Steve</div>
                    <div class="box1">Mia</div>
                </div>
            </div>
        </div>
        <script src="scripts.js"></script> 
    </body>
</html>
