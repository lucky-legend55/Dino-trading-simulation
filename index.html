<!DOCTYPE html>
<html lang="en">
    <head>
        <title>
            Dino trading simulation
        </title>
        <meta charset="UTF-8">
        <link rel="stylesheet" type="text/css" href="styles.css">
    </head>
    <body>
        <h1>Trading simulation</h1>
        <button type="button" id="start">Press Here to Start</button>

        <div id="intro" hidden>
            <h2>Meet the dinos</h2>
            <div class="grid">
                <div class="box" onclick="openPopup('Image 1 details')">
                    <img src="https://via.placeholder.com/100" alt="Image 1">
                </div>
                <div class="box" onclick="openPopup('Image 2 details')">
                    <img src="https://via.placeholder.com/100" alt="Image 2">
                </div>
                <div class="box" onclick="openPopup('Image 3 details')">
                    <img src="https://via.placeholder.com/100" alt="Image 3">
                </div>
                <div class="box" onclick="openPopup('Image 4 details')">
                    <img src="https://via.placeholder.com/100" alt="Image 4">
                </div>
                <div class="box" onclick="openPopup('Image 5 details')">
                    <img src="https://via.placeholder.com/100" alt="Image 5">
                </div>
                <div class="box" onclick="openPopup('Image 6 details')">
                    <img src="https://via.placeholder.com/100" alt="Image 6">
                </div>
            </div>

            <div class="popup" id="popup">
                <div class="popup-content">
                    <p id="popup-text"></p>
                    <button class="close-btn" onclick="closePopup()">X Close</button>
                </div>
            </div>
            <br>
            <button type="button" id="to_trading">Are You Ready To Start Trading?</button>

        </div>
        <div id="simulation" hidden>
            <div id="bankscreen">
                <div id="main">
                    <div class="box1">A</div>
                    <div class="box1">B</div>
                </div>
                <div id="sidebar">
                    <div class="box1">1</div>
                    <div class="box1">2</div>
                    <div class="box1">3</div>
                    <div class="box1">4</div>
                    <div class="box1">5</div>
                    <div class="box1">6</div>
                </div>
            </div>
        </div>
        <script src="scripts.js"></script> 
    </body>
</html>
