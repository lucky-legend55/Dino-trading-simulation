<!DOCTYPE html>
<html lang="en">
    <head>
        <title>
            Dino trading simulation
        </title>
        <meta charset="UTF-8">
        <link rel="stylesheet" type="text/css" href="styles.css">
    </head>
    <body class="bg-start">
        <h1>Trading simulation</h1>
        <div id="start_screen" hidden>
            <button type="button" id="start">Straight to trading</button><button type="button" id="lesson">Click here to have a lesson</button>

        </div>
        <div id="learn" hidden>
            <div class="tutor">
                <img id="tutor-img" src="/imgs/Fulldinosaur.png" alt="Tutor dinosaur" >
                <div class="bubble">
                    <p id="bubble-text"></p>
                    <button type="button" id="nextMsg">Next</button>
                </div>
            </div>
            <button type="button" id="learnbtn" hidden>Continue to meet the dinos</button>
        </div>

        <div id="intro" hidden>
            <h2>Meet the dinos</h2>
            <div class="box1">Bank: <span id="bankTotal"></span> Rocks</div>
            <div class="grid">
                <div class="box" onclick="openPopup('Lewis The Lazy Dinosaur: Lazy dinosaur who procrastinates a lot but owns a pair of running shoes. Initial-price:300R')">
                    <img src="/imgs/Lewis.jpg" alt="Lewis">
                </div>
                <div class="box" onclick="openPopup('Clara The Cowgirl Dinosaur: Cowgirl who enters lots of dangerous rodeos woth her favourite horse. Initial-price:500R')">
                    <img src="/imgs/Clara.jpg" alt="Clara">
                </div>
                <div class="box" onclick="openPopup('Durhack Dino: Legendary dinosaur who likes pizza a little too much. Initial-price:1200R')">
                    <img src="/imgs/DurhackDino.jpg" alt="Durhack Dino">
                </div>

                <div class="box controls"></div>
                <div class="box controls"></div>
                <div class="box controls"></div>

                <div class="box" onclick="openPopup('Imogen the Influencer Dino: Influencer on tiktok who follows the trends online so in a volatile trend based market. Initial-price:200R')">
                    <img src="/imgs/Imogen.jpg" alt="Imogen">
                </div>
                <div class="box" onclick="openPopup('Steve the Sports Dinosaur: Sporty dinosaur who will do ANYTHING to stay on the team. Initial-price:900R')">
                    <img src="/imgs/Steve.jpg" alt="Steve">
                </div>
                <div class="box" onclick="openPopup('Mia the Musical Dinosaur: A nervous, yet talented singer who overpractices and falls ill easily. Initial-price:400R')">
                    <img src="/imgs/Mia.jpg" alt="Mia">
                </div>

                <div class="box controls"></div>
                <div class="box controls"></div>
                <div class="box controls"></div>
            </div>

            <div class="popup" id="popup">
                <div class="popup-content">
                    <p id="popup-text"></p>
                    <button class="close-btn" onclick="closePopup()">X Close</button>
                </div>
            </div>
            <br>
            <button type="button" id="to_trading">Are You Ready To Start Trading?</button>

        </div>
        <div id="simulation" hidden>
            <div id="alert" role="alert" aria-live="assertive">
                <strong id="aTitle"></strong>
                <p id="aBody"></p>
                <div id="aBar"><i id="aFill"></i></div>
                <button id="aPause" type="button"></button>
                </div>
                <div class="wrap">
                    <h1>Stock game</h1>
                    <p class="sub">Five minutes live that stand in for two months (one simulated day every 5 seconds). Price axis is logarithmic, from 1 to 2500.</p>

                    <div class="panel"><canvas id="chart"></canvas></div>
                     <div class="stats">
                        <div class="stat"><span>Bank</span><b id="bank"></b></div>
                        <div class="stat"><span>Portfolio value</span><b id="portfolio"></b></div>
                    </div>
                    <div class="bar">
                        <button id="go">Start</button>
                        <label>Speed <select id="speed"><option value="1">1x</option><option value="5">5x</option><option value="20">20x</option></select></label>
                        <span id="clock"></span>
                    </div>
                    <div class="legend" id="legend"></div>
                    
                </div>
                <button type="button" id="finalscreen">Have another go?</button>
        </div>
        <div id="finished" hidden>
            <div id="finalbox">
            </div>
        </div>
        <script src="scripts.js"></script> 
    </body>
</html>
