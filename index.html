<!DOCTYPE html>
<html lang="en">
    <head>
        <title>
            Dino trading simulation
        </title>
        <meta charset="UTF-8">
        <link rel="stylesheet" type="text/css" href="styles.css">
    </head>
    <body>
        <h1>Trading simulation</h1>
        <button type="button" id="start">Press Here to Start</button>

        <div id="game" hidden>
            <h2>Meet the dinos</h2>
            <div id="grid">
                <div class="box">1</div>
                <div class="box">2</div>
                <div class="box">3</div>
                <div class="box">4</div>
                <div class="box">5</div>
                <div class="box">6</div>
                <div class="box">7</div>
                <div class="box">8</div>
            </div>

        </div>
        <script src="scripts.js"></script> 
    </body>
</html>
